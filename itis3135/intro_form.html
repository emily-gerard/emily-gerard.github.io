<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Introduction Form</title>
    <link rel="stylesheet" href="styles/default.css" />
    <script
      src="https://lint.page/kit/4d0fe3.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div data-include="components/header.html"></div>

    <main>
      <h2>Introduction Form</h2>

      <h3>Please submit the form below.</h3>
      <form>
        <p>
          <label for="f_name">First Name: </label>
          <input type="text" id="f_name" name="f_name" value="Emily" required />
        </p>
        <p>
          <label for="m_name">Middle Name: </label>
          <input type="text" id="m_name" name="m_name" value="Elizabeth" />
        </p>
        <p>
          <label for="n_name">Nickname: </label>
          <input type="text" id="n_name" name="n_name" />
        </p>
        <p>
          <label for="l_name">Last Name: </label>
          <input
            type="text"
            id="l_name"
            name="l_name"
            value="Gerard"
            required
          />
        </p>
        <p>
          <label for="acknowledgement">Acknowledgement Statement: </label>
          <input
            type="text"
            id="acknowledgement"
            name="acknowledgement"
            value="I understand that what is on this page is not password protected..."
            required
          />
        </p>
        <p>
          <label for="ack_date">Acknowledgement Date: </label>
          <input
            type="date"
            id="ack_date"
            name="ack_date"
            value="2026-01-13"
            required
          />
        </p>
        <p>
          <label for="mascot_adj">Mascot Adjective: </label>
          <input
            type="text"
            id="mascot_adj"
            name="mascot_adj"
            value="Eclectic"
            required
          />
        </p>
        <p>
          <label for="mascot_ani">Mascot Animal: </label>
          <input
            type="text"
            id="mascot_ani"
            name="mascot_ani"
            value="Goldfish"
            required
          />
        </p>
        <p>
          <label for="divider">Divider: </label>
          <input type="text" id="divider" name="divider" value="|" required />
        </p>
        <p>
          <label for="picture">Picture: </label>
          <img src="images/lizard.jpg" alt="value" width="210" height="200" />
          <input type="file" id="picture" name="picture" required />
        </p>
        <p>
          <label for="caption">Picture Caption: </label>
          <input
            type="text"
            id="caption"
            name="caption"
            value="Made a lizard friend."
            required
          />
        </p>
        <p>
          <label for="p_statement">Personal Statement: </label>
          <input
            type="text"
            id="p_statement"
            name="p_statement"
            value="I’m a sophomore at UNC Charlotte studying computer science..."
            required
          />
        </p>
        <p>
          <label for="per_background">Personal Background: </label>
          <input
            type="text"
            id="per_background"
            name="per_background"
            value="I spend most of my free time on my computer..."
            required
          />
        </p>
        <p>
          <label for="prof_background">Professional Background: </label>
          <input
            type="text"
            id="prof_background"
            name="prof_background"
            value="I’ve worked in customer service since I was 16..."
            required
          />
        </p>
        <p>
          <label for="a_background">Academic Background: </label>
          <input
            type="text"
            id="a_background"
            name="a_background"
            value="I’m currently a sophomore at UNC Charlotte..."
            required
          />
        </p>
        <p>
          <label for="sub_background">Background in Subject: </label>
          <input
            type="text"
            id="sub_background"
            name="sub_background"
            value=" I’ve taken a class in high school covering surface level web development..."
            required
          />
        </p>
        <p>
          <label for="prim_comp">Primary Computer: </label>
          <input
            type="text"
            id="prim_comp"
            name="prim_comp"
            value="I mainly use my Macbook Pro laptop..."
            required
          />
        </p>
        <p>
          <label for="backup">Backup Computer: </label>
          <input
            type="text"
            id="backup"
            name="backup"
            value=" have my personal custom desktop computer..."
            required
          />
        </p>
        <p>
          <h4>Course 1:</h4>
          <label for="c1_dep">Course Department: </label>
          <input
            type="text"
            id="c1_dep"
            name="c1_dep"
            value="ITIS"
            required
          />
          <label for="c1_num">Course Number: </label>
          <input type="number" id="c1_num" name="c1_num" value="3135" required/>
          <label for="c1_name">Course Name: </label>
          <input type="text" id="c1_name" name="c1_name" value="Front End Web Development" required/>
          <label for="c1_reason">Course Reason: </label>
          <input type="text" id="c1_reason" name="c1_reason" value="Required course." required/>
        </p>
        <p>
        <h4>Course 2:</h4>
        <label for="c2_dep">Course Department: </label>
        <input
          type="text"
          id="c2_dep"
          name="c2_dep"
          value="MATH"
          required
        />
        <label for="c2_num">Course Number: </label>
        <input type="number" id="c2_num" name="c2_num" value="1241" required/>
        <label for="c2_name">Course Name: </label>
        <input type="text" id="c2_name" name="c2_name" value="Calculus 1" required/>
        <label for="c2_reason">Course Reason: </label>
        <input type="text" id="c2_reason" name="c2_reason" value="Required course." required/>
        </p>
        <p>
          <h4>Course 3:</h4>
        <label for="c3_dep">Course Department: </label>
        <input
          type="text"
          id="c3_dep"
          name="c3_dep"
          value="CTCM"
          required
        />
        <label for="c3_num">Course Number: </label>
        <input type="number" id="c3_num" name="c3_num" value="2530" required/>
        <label for="c3_name">Course Name: </label>
        <input type="text" id="c3_name" name="c3_name" value="Critical Thinking" required/>
        <label for="c3_reason">Course Reason: </label>
        <input type="text" id="c3_reason" name="c3_reason" value="Required course." required/>
        </p>
        <p>
          <h4>Course 4:</h4>
        <label for="c4_dep">Course Department: </label>
        <input
          type="text"
          id="c4_dep"
          name="c4_dep"
          value="ITSC"
          required
        />
        <label for="c4_num">Course Number: </label>
        <input type="number" id="c4_num" name="c4_num" value="2181" required/>
        <label for="c4_name">Course Name: </label>
        <input type="text" id="c4_name" name="c4_name" value="Intro to Computer Systems" required/>
        <label for="c4_reason">Course Reason: </label>
        <input type="text" id="c4_reason" name="c4_reason" value="Required course." required/>
        </p>
        <p>
          <h4>Course 5:</h4>
        <label for="c5_dep">Course Department: </label>
        <input
          type="text"
          id="c5_dep"
          name="c5_dep"
          value="ANTH"
          required
        />
        <label for="c5_num">Course Number: </label>
        <input type="number" id="c5_num" name="c5_num" value="2141" required/>
        <label for="c5_name">Course Name: </label>
        <input type="text" id="c5_name" name="c5_name" value="Biological Anthropology" required/>
        <label for="c5_reason">Course Reason: </label>
        <input type="text" id="c5_reason" name="c5_reason" value="Required course." required/>
        </p>
        <p>
          <h4>Course 6:</h4>
        <label for="c6_dep">Course Department: </label>
        <input
          type="text"
          id="c6_dep"
          name="c6_dep"
          value="ANTH"
        />
        <label for="c6_num">Course Number: </label>
        <input type="number" id="c6_num" name="c6_num" value="2141L" />
        <label for="c6_name">Course Name: </label>
        <input type="text" id="c6_name" name="c6_name" value="Biological Anthropology Lab" />
        <label for="c6_reason">Course Reason: </label>
        <input type="text" id="c6_reason" name="c6_reason" value="Required course." />
        </p>
        <p>
          <label for="quote">Quote: </label>
          <input type="text" id="quote" name="quote" value="A person who thinks all the time..." required/>
        </p>
        <p>
          <label for="author">Quote Author: </label>
          <input type="text" id="author" name="author" value="Alan Watts" required/>
        </p>
        <p>
          <label for="fun_fact">Fun Fact: </label>
          <input type="text" id="fun_fact" name="fun_fact" value="I've seen the same music artist four times!"/>
        </p>
        <p>
          <label for="share">Something to Share: </label>
          <input type="text" id="share" name="share" />
        </p>
        <p>
          <h4>Links: </h4>
          <label for="github">GitHub:</label>
          <input type="url" id="github" name="github" value="https://github.com/emily-gerard" required/>
          <label for="git_io">GitHub.io: </label>
          <input type="url" id="git_io" name="git_io" value="https://emily-gerard.github.io/" required/>
          <label for="clt_site">Charlotte Site: </label>
          <input type="url" id="clt_site" name="clt_site" value="https://webpages.charlotte.edu/egerard2/" required/>
          <label for="linked">LinkedIn: </label>
          <input type="url" id="linked" name="linked" value="https://www.linkedin.com/in/emily-gerard-527338393/" required/>
          <label for="fcc">FreeCodeCamp: </label>
          <input type="url" id="fcc" name="fcc" value="https://www.freecodecamp.org/emilygerard" required/>
        </p>
      </form>
    </main>

    <div data-include="components/footer.html"></div>
    <script src="scripts/include.js"></script>
  </body>
</html>
