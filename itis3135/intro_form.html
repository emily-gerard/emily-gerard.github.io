<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Introduction Form</title>
    <link rel="stylesheet" href="styles/default.css" />
    <script
      src="https://lint.page/kit/4d0fe3.js"
      crossorigin="anonymous"
    ></script>
  </head>
</html>
<body>
  <div data-include="components/header.html"></div>

  <main>
    <h2>Introduction Form</h2>

    <h3>Please submit the form below.</h3>
    <form>
      <p>
        <label for="f_name">First Name: </label>
        <input
          type="text"
          id="f_name"
          name="f_name"
          placeholder="Emily"
          required
        />
      </p>
      <p>
        <label for="m_name">Middle Name: </label>
        <input type="text" id="m_name" name="m_name" placeholder="Elizabeth" />
      </p>
      <p>
        <label for="n_name">Nickname: </label>
        <input type="text" id="n_name" name="n_name" />
      </p>
      <p>
        <label for="l_name">Last Name: </label>
        <input
          type="text"
          id="l_name"
          name="l_name"
          placeholder="Gerard"
          required
        />
      </p>
      <p>
        <label for="acknowledgement">Acknowledgement Statement: </label>
        <input
          type="text"
          id="acknowledgement"
          name="acknowledgement"
          placeholder="I understand that what is on this page is not password protected and 
          I will not put anything here that I don’t want publicly available"
          required
        />
      </p>
      <p>
        <label for="ack_date">Acknowledgement Date: </label>
        <input
          type="number"
          id="ack_date"
          name="ack_date"
          placeholder="1/13/2025"
          required
        />
      </p>
      <p>
        <label for="mascot_adj">Mascot Adjective: </label>
        <input
          type="text"
          id="mascot_adj"
          name="mascot_adj"
          placeholder="Eclectic"
          required
        />
      </p>
      <p>
        <label for="mascot_ani">Mascot Animal: </label>
        <input
          type="text"
          id="mascot_ani"
          name="mascot_ani"
          placeholder="Goldfish"
          required
        />
      </p>
      <p>
        <label for="divider">Divider: </label>
        <input
          type="text"
          id="divider"
          name="divider"
          placeholder="|"
          required
        />
      </p>
    </form>
  </main>

  <div data-include="components/footer.html"></div>
  <script src="scripts/include.js"></script>
</body>
