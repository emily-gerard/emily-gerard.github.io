<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Introduction Form</title>
    <link rel="stylesheet" href="styles/default.css" />
    <script
      src="https://lint.page/kit/4d0fe3.js"
      crossorigin="anonymous"
    ></script>
  </head>
</html>
<body>
  <div data-include="components/header.html"></div>

  <main>
    <h2>Introduction Form</h2>

    <h3>Please submit the form below.</h3>
    <form>
      <p>
        <label for="f_name">First Name: </label>
        <input
          type="text"
          id="f_name"
          name="f_name"
          placeholder="Emily"
          required
        />
      </p>
      <p>
        <label for="m_name">Middle Name: </label>
        <input type="text" id="m_name" name="m_name" placeholder="Elizabeth" />
      </p>
      <p>
        <label for="n_name">Nickname: </label>
        <input type="text" id="n_name" name="n_name" />
      </p>
    </form>
  </main>

  <div data-include="components/footer.html"></div>
  <script src="scripts/include.js"></script>
</body>
